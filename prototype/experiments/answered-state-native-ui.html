<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>URAWA HISTORY — Answered State Native UI</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#171717">
  <style>
    :root{--paper:#fffefb;--bg:#efede8;--ink:#171717;--muted:#716d66;--line:#d9d5ce;--red:#c3152a;--good:#287a4b;--wrong:#8c4338;--focus:#1e5aa8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .shell{min-height:100svh;max-width:820px;margin:auto;background:var(--paper);border-inline:1px solid var(--line)}
    .top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;font-size:12px;font-weight:950;letter-spacing:.1em}.mark{width:11px;height:11px;background:var(--red);transform:rotate(45deg)}.lab{font-size:10px;font-weight:850;letter-spacing:.12em;color:var(--muted)}
    .variant-nav{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}.variant-nav button{min-height:48px;border:0;border-right:1px solid var(--line);background:transparent;font-size:11px;font-weight:900;letter-spacing:.08em}.variant-nav button:last-child{border-right:0}.variant-nav button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--red);color:var(--ink)}
    main{padding:24px 18px 90px;max-width:640px;margin:auto}.meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:850;letter-spacing:.1em;color:var(--muted)}.year{font-size:clamp(68px,23vw,122px);line-height:.84;letter-spacing:-.075em;font-weight:950;margin:18px 0 24px}.question{font-size:clamp(25px,7vw,38px);line-height:1.24;letter-spacing:-.035em;margin:0 0 26px;max-width:17em}
    .options{display:grid;gap:10px}.option{min-height:60px;width:100%;border:1px solid #bdb8b0;background:transparent;padding:13px 15px;text-align:left;display:grid;grid-template-columns:32px 1fr;align-items:center;gap:12px;border-radius:5px;cursor:pointer}.option:hover{border-color:var(--ink)}.idx{font-size:12px;font-weight:950;letter-spacing:.05em}.option.correct{border-color:var(--good);background:#f1f7f3}.option.wrong{border-color:var(--wrong);background:#fbf3f1}.option:disabled{cursor:default}
    .feedback{display:none;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.feedback.show{display:block}.result{font-size:11px;font-weight:950;letter-spacing:.13em}.good{color:var(--good)}.bad{color:var(--wrong)}.answer{font-size:30px;line-height:1.12;letter-spacing:-.035em;margin:7px 0 16px}.memory{border-left:3px solid var(--ink);padding:2px 0 2px 14px;line-height:1.7;font-size:16px}.memory-label{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.primary,.secondary{min-height:48px;padding:0 17px;font-weight:850;border-radius:5px;cursor:pointer}.primary{background:var(--ink);color:white;border:1px solid var(--ink)}.secondary{background:transparent;border:1px solid var(--line)}
    .history{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.history-kicker{display:flex;align-items:center;gap:8px;color:var(--red);font-size:10px;font-weight:950;letter-spacing:.13em}.diamond{width:8px;height:8px;background:var(--red);transform:rotate(45deg);flex:none}.history-title{font-size:22px;letter-spacing:-.03em;margin:8px 0 12px}.spine{display:grid;grid-template-columns:repeat(3,1fr);position:relative;padding:10px 0 12px}.spine::before{content:"";position:absolute;left:16.7%;right:16.7%;top:18px;height:1px;background:var(--line)}.spine button{position:relative;z-index:1;min-height:48px;border:0;background:transparent;display:grid;justify-items:center;gap:7px;color:var(--muted);cursor:pointer}.node{width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);transform:rotate(45deg)}.spine button[aria-current="true"]{color:var(--ink)}.spine button[aria-current="true"] .node{background:var(--red);border-color:var(--red);transform:rotate(45deg) scale(1.28)}.spine button[aria-pressed="true"]:not([aria-current="true"]) .node{background:var(--ink)}.echo{min-height:56px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.55}.echo strong{color:var(--red)}
    .deep-stage{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.deep-year{font-size:clamp(80px,28vw,150px);font-weight:950;line-height:.78;letter-spacing:-.085em;margin:20px 0 12px;color:var(--red)}.deep-word{font-size:clamp(25px,8vw,46px);font-weight:950;letter-spacing:-.045em;line-height:1;margin-bottom:18px}.deep-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:20px 0}.deep-line::before,.deep-line::after{content:"";height:1px;background:var(--line)}
    .explain{margin-top:34px;padding-top:16px;border-top:1px dashed var(--line);font-size:12px;line-height:1.65;color:var(--muted)}.explain strong{color:var(--ink)}
    @media(prefers-reduced-motion:no-preference){.feedback.show .history,.feedback.show .deep-stage{animation:reveal .22s ease both}@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}}
    @media(min-width:760px){body{padding:24px}.shell{min-height:calc(100svh - 48px);border:1px solid var(--line)}main{padding:36px 42px 90px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span>URAWA HISTORY</div><div class="lab">ANSWERED STATE LAB</div></header>
  <nav class="variant-nav" aria-label="比較するAnswered State">
    <button data-variant="A" aria-pressed="false">A · STANDARD</button>
    <button data-variant="B" aria-pressed="true">B · SPINE</button>
    <button data-variant="C" aria-pressed="false">C · DEEP</button>
  </nav>
  <main>
    <div class="meta"><span>PLAYER · 2006</span><span>SOURCE CHECKED</span></div>
    <div class="year" id="questionYear">2006</div>
    <h1 class="question">2006年の浦和レッズで背番号「21」を背負った選手は？</h1>
    <div class="options" id="options">
      <button class="option" data-value="ワシントン"><span class="idx">01</span><strong>ワシントン</strong></button>
      <button class="option" data-value="岡野 雅行"><span class="idx">02</span><strong>岡野 雅行</strong></button>
      <button class="option" data-value="田中 達也"><span class="idx">03</span><strong>田中 達也</strong></button>
      <button class="option" data-value="都築 龍太"><span class="idx">04</span><strong>都築 龍太</strong></button>
    </div>
    <section class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></section>
    <div class="explain" id="explain"></div>
  </main>
</div>
<script>
  const correct='ワシントン';
  const memory='2006年のワシントンは背番号21。リーグ初優勝を支えた得点源として、この年と結びつけて覚える。';
  const echoes={2005:'天皇杯制覇。国内タイトルの流れが翌年へ続く。',2006:'J1初優勝。ワシントン #21がいた国内リーグの頂点。',2007:'ACL初制覇。国内の頂点からアジアへ。'};
  const notes={
    A:'守。結果・答え・記憶・次へを最短で処理するcontrol。Historyは出さない。',
    B:'破。回答後だけHistory Spineを出す。Quizの流れを保ちながら、答えを前後年へ接続する。',
    C:'離の強い案。回答後に画面の主役を「答え」から「2006という場所」へ大胆に変える。驚きは最大だが、継続性コストも高い。'
  };
  let variant='B'; let answered=false;
  const feedback=document.querySelector('#feedback');
  const options=[...document.querySelectorAll('.option')];
  const explain=document.querySelector('#explain');
  function actions(){return '<div class="actions"><button class="primary" data-next>次の問題へ</button><button class="secondary" data-explore>2006年を見る</button></div>'}
  function baseResult(good){return `<div class="result ${good?'good':'bad'}">${good?'CORRECT':'NOT THIS TIME'}</div><h2 class="answer">${correct}</h2><div class="memory"><span class="memory-label">MEMORY ECHO</span>${memory}</div>`}
  function renderFeedback(good){
    if(variant==='A') feedback.innerHTML=baseResult(good)+actions();
    if(variant==='B') feedback.innerHTML=baseResult(good)+`<section class="history" aria-labelledby="historyTitle"><div class="history-kicker"><span class="diamond" aria-hidden="true"></span>YOU ARE HERE</div><h3 class="history-title" id="historyTitle">答えを、時間の中に置く。</h3><div class="spine" aria-label="2005年から2007年"><button data-year="2005" aria-pressed="false"><span class="node" aria-hidden="true"></span><strong>2005</strong></button><button data-year="2006" aria-current="true" aria-pressed="true"><span class="node" aria-hidden="true"></span><strong>2006</strong></button><button data-year="2007" aria-pressed="false"><span class="node" aria-hidden="true"></span><strong>2007</strong></button></div><div class="echo" id="echo"><strong>2006</strong> — ${echoes[2006]}</div></section>`+actions();
    if(variant==='C') feedback.innerHTML=`<div class="result ${good?'good':'bad'}">${good?'CORRECT':'NOT THIS TIME'}</div><section class="deep-stage"><div class="history-kicker"><span class="diamond" aria-hidden="true"></span>YOU ARRIVED IN</div><div class="deep-year">2006</div><div class="deep-word">WASHINGTON · #21</div><div class="memory"><span class="memory-label">MEMORY ECHO</span>${memory}</div><div class="deep-line">2005 → 2006 → 2007</div></section>`+actions();
    feedback.classList.add('show'); explain.innerHTML=`<strong>Variant ${variant}:</strong> ${notes[variant]}`; bindFeedback();
  }
  function bindFeedback(){
    feedback.querySelectorAll('[data-year]').forEach(btn=>btn.addEventListener('click',()=>{feedback.querySelectorAll('[data-year]').forEach(b=>b.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true');document.querySelector('#echo').innerHTML=`<strong>${btn.dataset.year}</strong> — ${echoes[btn.dataset.year]}`;}));
    feedback.querySelector('[data-next]')?.addEventListener('click',reset);
    feedback.querySelector('[data-explore]')?.addEventListener('click',()=>alert('Experiment: productionではSeason Detailへ遷移'));
  }
  function answer(btn){if(answered)return;answered=true;const good=btn.dataset.value===correct;options.forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add('correct');if(b===btn&&!good)b.classList.add('wrong')});renderFeedback(good);feedback.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}
  function reset(){answered=false;options.forEach(b=>{b.disabled=false;b.classList.remove('correct','wrong')});feedback.classList.remove('show');feedback.innerHTML='';explain.innerHTML=`<strong>Variant ${variant}:</strong> ${notes[variant]}`;document.querySelector('#questionYear').scrollIntoView({block:'start'});}
  options.forEach(btn=>btn.addEventListener('click',()=>answer(btn)));
  document.querySelectorAll('[data-variant]').forEach(btn=>btn.addEventListener('click',()=>{variant=btn.dataset.variant;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));reset();}));
  explain.innerHTML=`<strong>Variant B:</strong> ${notes.B}`;
</script>
</body>
</html>
