<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>URAWA HISTORY — Answered State B+</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#171717">
  <style>
    :root{--paper:#fffefb;--bg:#efede8;--ink:#171717;--muted:#716d66;--line:#d9d5ce;--red:#c3152a;--good:#287a4b;--wrong:#8c4338;--focus:#1e5aa8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.shell{min-height:100svh;max-width:760px;margin:auto;background:var(--paper);border-inline:1px solid var(--line)}
    .top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:9px;align-items:center;font-size:12px;font-weight:950;letter-spacing:.1em}.mark{width:11px;height:11px;background:var(--red);transform:rotate(45deg)}.lab{font-size:10px;font-weight:850;letter-spacing:.12em;color:var(--muted)}
    main{padding:24px 18px 90px;max-width:620px;margin:auto}.meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:850;letter-spacing:.1em;color:var(--muted)}.year{font-size:clamp(68px,23vw,122px);line-height:.84;letter-spacing:-.075em;font-weight:950;margin:18px 0 24px}.question{font-size:clamp(25px,7vw,38px);line-height:1.24;letter-spacing:-.035em;margin:0 0 26px;max-width:17em}
    .options{display:grid;gap:10px}.option{min-height:60px;width:100%;border:1px solid #bdb8b0;background:transparent;padding:13px 15px;text-align:left;display:grid;grid-template-columns:32px 1fr;align-items:center;gap:12px;border-radius:5px;cursor:pointer}.option:hover{border-color:var(--ink)}.idx{font-size:12px;font-weight:950}.option.correct{border-color:var(--good);background:#f1f7f3}.option.wrong{border-color:var(--wrong);background:#fbf3f1}.option:disabled{cursor:default}
    .feedback{display:none;margin-top:26px;padding-top:19px;border-top:1px solid var(--line)}.feedback.show{display:block}.result{font-size:11px;font-weight:950;letter-spacing:.13em}.good{color:var(--good)}.bad{color:var(--wrong)}.answer{font-size:31px;line-height:1.1;letter-spacing:-.035em;margin:7px 0 16px}.memory{font-size:16px;line-height:1.65;padding-left:14px;border-left:3px solid var(--ink)}.memory-label{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
    .spine-wrap{margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0 10px}.spine{display:grid;grid-template-columns:repeat(3,1fr);position:relative}.spine::before{content:"";position:absolute;left:16.7%;right:16.7%;top:17px;height:1px;background:var(--line)}.spine button{position:relative;z-index:1;min-height:48px;border:0;background:transparent;display:grid;justify-items:center;gap:6px;color:var(--muted);cursor:pointer}.node{width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);transform:rotate(45deg)}.spine button[aria-current="true"]{color:var(--ink)}.spine button[aria-current="true"] .node{background:var(--red);border-color:var(--red);transform:rotate(45deg) scale(1.28)}.spine button[aria-pressed="true"]:not([aria-current="true"]) .node{background:var(--ink)}.year-label{font-size:13px;font-weight:900}.echo{min-height:48px;padding:9px 2px 2px;font-size:13px;line-height:1.5;color:#494640}.echo strong{color:var(--red)}
    .actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:20px}.primary,.secondary{min-height:50px;padding:0 17px;font-weight:850;border-radius:5px;cursor:pointer}.primary{background:var(--ink);color:white;border:1px solid var(--ink)}.secondary{background:transparent;border:1px solid var(--line)}
    .note{margin-top:30px;padding-top:15px;border-top:1px dashed var(--line);font-size:12px;line-height:1.6;color:var(--muted)}.note strong{color:var(--ink)}
    @media(prefers-reduced-motion:no-preference){.feedback.show .spine-wrap{animation:reveal .2s ease both}@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
    @media(min-width:520px){.actions{grid-template-columns:auto auto;justify-content:start}.primary,.secondary{min-width:160px}}
    @media(min-width:760px){body{padding:24px}.shell{min-height:calc(100svh - 48px);border:1px solid var(--line)}main{padding:36px 42px 90px}}
  </style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span>URAWA HISTORY</div><div class="lab">B+ · WINNER</div></header>
<main>
  <div class="meta"><span>PLAYER · 2006</span><span>SOURCE CHECKED</span></div>
  <div class="year">2006</div>
  <h1 class="question">2006年の浦和レッズで背番号「21」を背負った選手は？</h1>
  <div class="options" id="options">
    <button class="option" data-value="ワシントン"><span class="idx">01</span><strong>ワシントン</strong></button>
    <button class="option" data-value="岡野 雅行"><span class="idx">02</span><strong>岡野 雅行</strong></button>
    <button class="option" data-value="田中 達也"><span class="idx">03</span><strong>田中 達也</strong></button>
    <button class="option" data-value="都築 龍太"><span class="idx">04</span><strong>都築 龍太</strong></button>
  </div>
  <section class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true">
    <div class="result" id="result"></div>
    <h2 class="answer">ワシントン</h2>
    <div class="memory"><span class="memory-label">MEMORY ECHO</span>2006年のワシントンは背番号21。リーグ初優勝を支えた得点源として、この年と結びつけて覚える。</div>
    <div class="spine-wrap">
      <div class="spine" aria-label="2005年から2007年の前後関係">
        <button data-year="2005" aria-pressed="false"><span class="node" aria-hidden="true"></span><span class="year-label">2005</span></button>
        <button data-year="2006" aria-current="true" aria-pressed="true"><span class="node" aria-hidden="true"></span><span class="year-label">2006</span></button>
        <button data-year="2007" aria-pressed="false"><span class="node" aria-hidden="true"></span><span class="year-label">2007</span></button>
      </div>
      <div class="echo" id="echo"><strong>2006</strong> — J1初優勝。国内リーグの頂点。</div>
    </div>
    <div class="actions"><button class="primary" id="next">次の問題へ</button><button class="secondary" id="explore">2006年を見る</button></div>
  </section>
  <div class="note"><strong>B+ decision:</strong> 回答後に説明パネルを追加するのではなく、3年だけのHistory Spineが静かに現れる。赤はcurrent yearだけ、隣年previewは黒。NextをPrimaryのまま維持する。</div>
</main>
</div>
<script>
const correct='ワシントン';const echoes={2005:'天皇杯制覇。国内タイトルの流れが翌年へ続く。',2006:'J1初優勝。国内リーグの頂点。',2007:'ACL初制覇。国内の頂点からアジアへ。'};const options=[...document.querySelectorAll('.option')];const feedback=document.querySelector('#feedback');const result=document.querySelector('#result');let answered=false;
options.forEach(btn=>btn.addEventListener('click',()=>{if(answered)return;answered=true;const good=btn.dataset.value===correct;options.forEach(b=>{b.disabled=true;if(b.dataset.value===correct)b.classList.add('correct');if(b===btn&&!good)b.classList.add('wrong')});result.textContent=good?'CORRECT':'NOT THIS TIME';result.className=`result ${good?'good':'bad'}`;feedback.classList.add('show');feedback.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});}));
document.querySelectorAll('[data-year]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-year]').forEach(b=>b.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true');document.querySelector('#echo').innerHTML=`<strong>${btn.dataset.year}</strong> — ${echoes[btn.dataset.year]}`;}));
document.querySelector('#next').addEventListener('click',()=>location.reload());document.querySelector('#explore').addEventListener('click',()=>alert('Experiment: productionではSeason Detailへ遷移'));
</script>
</body>
</html>
