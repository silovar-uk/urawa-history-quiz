name: Apply Answered State B+

on:
  push:
    paths:
      - 'scripts/document-bplus-status.mjs'
      - '.github/workflows/apply-answered-state-bplus.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize canonical UI documentation
        run: node scripts/document-bplus-status.mjs
      - name: Verify documentation scope
        run: |
          git diff -- docs/current-state.md docs/ui-answered-state-native-round.md
          test -z "$(git status --short | grep -vE 'docs/(current-state\.md|ui-answered-state-native-round\.md)$')"
      - name: Commit documentation sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-state.md docs/ui-answered-state-native-round.md
          git commit -m "Record Answered State B+ production integration" || exit 0
          git push
