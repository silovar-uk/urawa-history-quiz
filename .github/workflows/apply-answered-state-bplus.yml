name: Apply Answered State B+

on:
  push:
    paths:
      - 'scripts/apply-answered-state-bplus.mjs'
      - 'scripts/fix-bplus-edge-context.mjs'
      - '.github/workflows/apply-answered-state-bplus.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final guarded B+ fix
        run: node scripts/fix-bplus-edge-context.mjs
      - name: Check production JS syntax
        run: node --check prototype/app.js
      - name: Verify migration scope
        run: |
          git diff -- prototype/app.js
          test -z "$(git status --short | grep -vE 'prototype/app\.js$')"
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/app.js
          git commit -m "Keep B+ history context at three seasons on timeline edges" || exit 0
          git push
