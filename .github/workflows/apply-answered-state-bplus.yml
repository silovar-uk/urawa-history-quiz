name: Apply Answered State B+

on:
  push:
    paths:
      - 'scripts/apply-answered-state-bplus.mjs'
      - '.github/workflows/apply-answered-state-bplus.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded migration
        run: node scripts/apply-answered-state-bplus.mjs
      - name: Check production JS syntax
        run: node --check prototype/app.js
      - name: Verify migration scope
        run: |
          git diff -- prototype/app.js prototype/styles.css
          test -z "$(git status --short | grep -vE 'prototype/(app\.js|styles\.css)$')"
      - name: Commit production slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/app.js prototype/styles.css
          git commit -m "Integrate Answered State B+ into production" || exit 0
          git push
