name: Finalize Q4 Canonical Docs

on:
  push:
    paths:
      - '.github/workflows/finalize-q4-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded closeout corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/quiz-quality-plan.md')
          s = p.read_text()
          old_list = "5. Q2 Quality Audit\n7. Q3 Structural Difficulty Audit\n8. Q4 deterministic Coverage / Exposure Audit\n9. Q3 artifact upload\n10. Q4 coverage artifact upload"
          new_list = "5. Q2 Quality Audit\n6. Q3 Structural Difficulty Audit\n7. Q4 deterministic Coverage / Exposure Audit\n8. Q3 artifact upload\n9. Q4 coverage artifact upload"
          if s.count(old_list) != 1:
              raise SystemExit(f'expected one CI numbering block, found {s.count(old_list)}')
          s = s.replace(old_list, new_list)
          old_seq = "Q5 Significance / Memory Hook        NOW\n↓\nQ6 Learning History\n↓\nAnswered History Spine Integration\n↓\nHistory Browser Refinement"
          new_seq = "Q5 Significance / Memory Hook        NOW\n↓\nQ6 Learning History\n↓\nExposure weighting / adaptive-light only if justified\n↓\nHistory Grammar / Browser refinement after UX validation"
          if s.count(old_seq) != 1:
              raise SystemExit(f'expected one stale sequence block, found {s.count(old_seq)}')
          s = s.replace(old_seq, new_seq)
          p.write_text(s)
          PY

      - name: Verify correction scope
        run: |
          git diff -- docs/quiz-quality-plan.md
          test -z "$(git status --short | grep -vE 'docs/quiz-quality-plan\.md$')"

      - name: Commit closeout corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quiz-quality-plan.md
          git commit -m "Polish Q4 closeout sequence" || exit 0
          git push
